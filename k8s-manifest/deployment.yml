apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  namespace: ajay-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bms
  template:
    metadata:
      labels:
        app: bms
    spec:
      containers:
      - name: bms-container
        image: ajaykumar5292/bms:v1  
        ports:
        - containerPort: 3000  
